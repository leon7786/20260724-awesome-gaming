<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毁灭战士 (2016) - 游戏详情</title>
<style>
:root {
  --bg: #fafbfc;
  --surface: #ffffff;
  --border: #e5e7eb;
  --text-primary: #111827;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --accent: #3b82f6;
  --accent-light: #dbeafe;
  --success: #10b981;
  --warning: #f59e0b;
  --radius: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* 顶部导航 */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 500;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  transition: all 0.2s;
}

.topbar a:hover {
  background: var(--accent-light);
  color: var(--accent);
}

/* 游戏头部 */
.hero {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 2rem;
}

.hero .container {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 2.5rem;
  align-items: start;
}

.hero-cover {
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  aspect-ratio: 3/4;
}

.hero-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero-info {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding-top: 0.5rem;
}

.hero-info h1 {
  font-size: 2.25rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
}

.hero-info .en-name {
  font-size: 1.125rem;
  color: var(--text-secondary);
  font-weight: 400;
}

.meta-tags {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.meta-tag {
  font-size: 0.8125rem;
  font-weight: 500;
  padding: 0.375rem 0.75rem;
  border-radius: 8px;
  background: #f3f4f6;
  color: var(--text-secondary);
}

.meta-tag.score {
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
}

.meta-tag.year {
  background: #fef3c7;
  color: #92400e;
}

.info-row {
  display: flex;
  gap: 2rem;
  flex-wrap: wrap;
}

.info-item {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.info-item .label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.info-item .value {
  font-size: 0.9375rem;
  color: var(--text-primary);
  font-weight: 500;
}

.hero-desc {
  font-size: 1rem;
  color: var(--text-secondary);
  line-height: 1.75;
  max-width: 640px;
}

/* 媒体区域 */
.media-section {
  max-width: 1200px;
  margin: 2rem auto;
  padding: 0 2rem;
}

.media-tabs {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.media-tab {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 0.5rem 1.25rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 500;
  transition: all 0.2s;
}

.media-tab:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.media-tab.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.media-player {
  border-radius: var(--radius);
  overflow: hidden;
  background: #000;
  aspect-ratio: 16/9;
}

.media-player video,
.media-player img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.screenshots-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 0.75rem;
}

.screenshots-grid img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
}

.screenshots-grid img:hover {
  transform: scale(1.02);
  box-shadow: var(--shadow);
}

/* 内容区域 */
.content-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 2rem 2rem;
}

.content-block {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 2rem;
  margin-bottom: 1.5rem;
}

.content-block h2 {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 1.25rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}

.content-block p {
  color: var(--text-secondary);
  font-size: 0.9375rem;
  line-height: 1.75;
  margin-bottom: 0.75rem;
}

.content-block h2.bb_tag {
  font-size: 1.125rem;
  color: var(--accent);
  margin: 1.5rem 0 0.75rem;
  padding-bottom: 0;
  border-bottom: none;
}

/* Steam 内嵌媒体 */
.content-block .bb_img_ctn {
  display: block;
  max-width: 100%;
  margin: 1rem 0;
  overflow: hidden;
  border-radius: 8px;
  background: #000;
}

.content-block .bb_img {
  max-width: 100% !important;
  width: 100% !important;
  height: auto !important;
  display: block;
  border-radius: 8px;
}

.content-block video.bb_img {
  width: 100% !important;
  height: auto !important;
  max-height: 500px;
  object-fit: contain;
  background: #000;
}

/* 下载区域 */
.download-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 2rem 2rem;
}

.download-block {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 2rem;
}

.download-block h2 {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 1.25rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}

.download-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.download-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1.5rem;
  border-radius: 10px;
  text-decoration: none;
  color: #fff;
  font-size: 0.9375rem;
  font-weight: 500;
  transition: all 0.2s;
  box-shadow: var(--shadow-sm);
}

.download-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.download-btn.gamer520 { background: linear-gradient(135deg, #10b981, #059669); }
.download-btn.x6d { background: linear-gradient(135deg, #3b82f6, #2563eb); }
.download-btn.magnet { background: linear-gradient(135deg, #f59e0b, #d97706); }
.download-btn.fitgirl { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
.download-btn.tianyi { background: linear-gradient(135deg, #6366f1, #4f46e5); }
.download-btn.baidu { background: linear-gradient(135deg, #06b6d4, #0891b2); }
.download-btn.crotorrents { background: linear-gradient(135deg, #ec4899, #db2777); }

/* 系统需求 */
.sys-req {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
}

.sys-req-col h4 {
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 1rem;
}

.sys-req-col ul {
  list-style: none;
}

.sys-req-col li {
  font-size: 0.875rem;
  color: var(--text-secondary);
  margin-bottom: 0.5rem;
  padding-left: 1.25rem;
  position: relative;
  line-height: 1.6;
}

.sys-req-col li:before {
  content: "•";
  position: absolute;
  left: 0;
  color: var(--accent);
  font-weight: bold;
}

/* 响应式 */
@media (max-width: 900px) {
  .hero .container {
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }
  .hero-cover {
    max-width: 280px;
    margin: 0 auto;
  }
  .hero-info h1 {
    font-size: 1.75rem;
  }
  .sys-req {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .hero {
    padding: 1.5rem 1rem;
  }
  .media-section,
  .content-section,
  .download-section {
    padding: 0 1rem 1.5rem;
  }
  .content-block,
  .download-block {
    padding: 1.5rem;
  }
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="topbar">
  <a href="../../index.html">← 返回游戏榜单</a>
  <a href="https://store.steampowered.com/app//" target="_blank">Steam 商店页 →</a>
</nav>

<!-- 游戏头部 -->
<section class="hero">
  <div class="container">
    <div class="hero-cover">
      <img src="" alt="毁灭战士 (2016)">
    </div>
    <div class="hero-info">
      <h1>毁灭战士 (2016)</h1>
      <div class="en-name">DOOM (2016)</div>
      
      <div class="meta-tags">
        <span class="meta-tag year">2016</span>
        <span class="meta-tag"></span>
        <span class="meta-tag score">⭐ —</span>
      </div>
      
      <div class="info-row">
        <div class="info-item">
          <span class="label">开发者</span>
          <span class="value"></span>
        </div>
        <div class="info-item">
          <span class="label">发行商</span>
          <span class="value"></span>
        </div>
      </div>
      
      <div class="hero-desc">
        
      </div>
    </div>
  </div>
</section>

<!-- 媒体区域 -->
<section class="media-section">
  <div class="media-tabs">
    <button class="media-tab active" onclick="showVideo()">▶ 视频</button>
    <button class="media-tab" onclick="showScreenshots()">🖼 截图</button>
  </div>
  
  <div id="video-container" class="media-player">
    
  </div>
  
  <div id="screenshots-container" class="screenshots-grid" style="display:none;">
    
  </div>
</section>

<!-- 关于此游戏 -->
<section class="content-section">
  <div class="content-block">
    <h2>关于此游戏</h2>
    <div></div>
  </div>
</section>

<!-- 下载区域 -->
<section class="download-section">
  <div class="download-block">
    <h2>📥 下载链接</h2>
    <div class="download-buttons">
      <p style="color:var(--text-muted)">暂无下载链接</p>
    </div>
  </div>
</section>

<!-- 系统需求 -->


<script>
function showVideo() {
  document.getElementById('video-container').style.display = 'block';
  document.getElementById('screenshots-container').style.display = 'none';
  document.querySelectorAll('.media-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

function showScreenshots() {
  const vc = document.getElementById('video-container');
  if (vc) vc.style.display = 'none';
  document.getElementById('screenshots-container').style.display = 'grid';
  document.querySelectorAll('.media-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}
</script>

</body>
</html>
