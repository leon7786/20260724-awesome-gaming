<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>铲子骑士 - Shovel Knight - 游戏详情</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#f5f5f7;color:#1a1a2e;line-height:1.6}
.topbar{background:#fff;border-bottom:1px solid #e0e0e4;padding:12px 0;position:sticky;top:0;z-index:100}
.topbar .container{display:flex;align-items:center;gap:16px}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.back{color:#6d28d9;text-decoration:none;font-size:14px;font-weight:500}
.hero{background:linear-gradient(180deg,#f0f0f5 0%,#e8e8f0 100%);padding:30px 0 0;border-bottom:1px solid #e0e0e4}
.hero .container{display:flex;gap:30px;flex-wrap:wrap}
.hero-info{flex:1;min-width:280px}
.hero-info h1{font-size:26px;margin-bottom:4px}
.hero-info .en{color:#888;font-size:14px;margin-bottom:12px}
.hero-info .meta{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.hero .tag{font-size:12px;padding:3px 10px;border-radius:4px;background:#e8e8ec;color:#555}
.hero .tag.sales{background:#e11d4822;color:#e11d48}
.hero-img{width:460px;max-width:100%;border-radius:8px;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.content{padding:24px 0}
.section{background:#fff;border-radius:8px;border:1px solid #e0e0e4;padding:24px;margin-bottom:16px}
.section h2{font-size:18px;color:#1a1a2e;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #e0e0e4}
.desc{font-size:15px;color:#444;line-height:1.7}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.info-item .label{font-size:12px;color:#888}
.info-item .value{font-size:14px;color:#1a1a2e;margin-top:2px}
@media(max-width:768px){.hero-img{width:100%}}
</style>
</head>
<body>

<div class="topbar">
  <div class="container">
    <a href="../index.html" class="back">← 返回游戏榜单</a>
  </div>
</div>

<div class="hero">
  <div class="container">
    <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1416050/header.jpg?t=1783731312" alt="Shovel Knight" class="hero-img" onerror="this.style.display='none'">
    <div class="hero-info">
      <h1>铲子骑士</h1>
      <div class="en">Shovel Knight</div>
      <div class="meta">
        <span class="tag">2014</span>
        <span class="tag sales">殿堂级 Top 250</span>
      </div>
      <div class="desc">在全新的《铲子骑士》冒险游戏《Shovel Knight Dig》中，沿着一条不断变化的神秘鸿沟，一路跳跃、砍杀和挖掘吧！</div>
    </div>
  </div>
</div>

<div class="content">
  <div class="container">
    <div class="section">
      <h2>📋 游戏信息</h2>
      <div class="info-grid">
        <div class="info-item"><div class="label">发行年份</div><div class="value">2014</div></div>
        <div class="info-item"><div class="label">平台</div><div class="value">PC / Console</div></div>
        <div class="info-item"><div class="label">荣誉</div><div class="value">复古8位机像素风格独立游戏复兴代表</div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
