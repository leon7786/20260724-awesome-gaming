<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏殿堂 - 精选游戏榜单与资源</title>
<style>
:root {
  --bg: #fafbfc;
  --surface: #ffffff;
  --border: #e5e7eb;
  --text-primary: #111827;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --accent: #3b82f6;
  --accent-light: #dbeafe;
  --success: #10b981;
  --warning: #f59e0b;
  --radius: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
  --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* 顶部导航 */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.navbar-brand {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-primary);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.navbar-brand span {
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.navbar-links {
  display: flex;
  gap: 0.5rem;
}

.navbar-links a {
  color: var(--text-secondary);
  text-decoration: none;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  font-size: 0.875rem;
  font-weight: 500;
  transition: var(--transition);
}

.navbar-links a:hover {
  background: var(--accent-light);
  color: var(--accent);
}

/* 主布局 */
.layout {
  display: flex;
  max-width: 1600px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}

/* 侧边栏 */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1.5rem 0;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
  overflow-y: auto;
}

.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

.sidebar-section {
  margin-bottom: 1.5rem;
}

.sidebar-title {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  padding: 0 1.5rem;
  margin-bottom: 0.5rem;
}

.sidebar-link {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.625rem 1.5rem;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 500;
  transition: var(--transition);
  border-left: 3px solid transparent;
}

.sidebar-link:hover {
  background: #f3f4f6;
  color: var(--text-primary);
}

.sidebar-link.active {
  background: var(--accent-light);
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 600;
}

/* 筛选按钮 */
.filter-bar {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 0.5rem 1rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
}

.filter-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.filter-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* 存储标签 */
.tag.size {
  background: #fef3c7;
  color: #92400e;
}

.tag.size-large {
  background: #fee2e2;
  color: #991b1b;
  font-weight: 600;
}

/* 主内容区 */
.main {
  flex: 1;
  min-width: 0;
  padding: 2rem;
}

/* 游戏卡片网格 */
.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1.5rem;
}

.game-card {
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
}

.game-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.game-cover {
  aspect-ratio: 3/4;
  background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
  overflow: hidden;
  position: relative;
}

.game-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.game-card:hover .game-cover img {
  transform: scale(1.05);
}

.game-info {
  padding: 1rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.game-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.game-subtitle {
  font-size: 0.8125rem;
  color: var(--text-secondary);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.game-meta {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.25rem;
}

.tag {
  font-size: 0.75rem;
  font-weight: 500;
  padding: 0.25rem 0.625rem;
  border-radius: 6px;
  background: #f3f4f6;
  color: var(--text-secondary);
}

.tag.score {
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
}

.tag.year {
  background: #fef3c7;
  color: #92400e;
}

.game-actions {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: auto;
  padding-top: 0.5rem;
}

.btn {
  font-size: 0.75rem;
  font-weight: 500;
  padding: 0.5rem 0.875rem;
  border-radius: 8px;
  text-decoration: none;
  color: white;
  transition: var(--transition);
  cursor: pointer;
  border: none;
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
}

.btn:hover {
  transform: translateY(-1px);
  filter: brightness(1.1);
}

.btn-primary {
  background: linear-gradient(135deg, #3b82f6, #2563eb);
}

.btn-success {
  background: linear-gradient(135deg, #10b981, #059669);
}

.btn-warning {
  background: linear-gradient(135deg, #f59e0b, #d97706);
}

.btn-secondary {
  background: linear-gradient(135deg, #6b7280, #4b5563);
}

/* Markdown 内容 */
.md-content {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 2rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  display: none;
}

.md-content.active {
  display: block;
}

.md-content h1 {
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 1rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid var(--border);
}

.md-content h2 {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);
  margin: 2rem 0 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}

.md-content h3 {
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--accent);
  margin: 1.5rem 0 0.75rem;
}

.md-content p {
  margin-bottom: 1rem;
  color: var(--text-secondary);
  line-height: 1.75;
}

.md-content ul, .md-content ol {
  padding-left: 1.5rem;
  margin-bottom: 1rem;
}

.md-content li {
  margin-bottom: 0.5rem;
  color: var(--text-secondary);
}

.md-content strong {
  color: var(--text-primary);
  font-weight: 600;
}

.md-content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2rem 0;
}

.md-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.5rem 0;
  font-size: 0.875rem;
}

.md-content th {
  background: #f9fafb;
  color: var(--text-primary);
  font-weight: 600;
  padding: 0.75rem 1rem;
  text-align: left;
  border-bottom: 2px solid var(--border);
}

.md-content td {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
}

.md-content tr:hover td {
  background: #f9fafb;
}

.md-content blockquote {
  border-left: 4px solid var(--accent);
  padding: 1rem 1.5rem;
  margin: 1.5rem 0;
  background: var(--accent-light);
  color: var(--text-secondary);
  border-radius: 0 var(--radius) var(--radius) 0;
}

.md-content code {
  background: #f3f4f6;
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
  font-size: 0.875rem;
  font-family: 'Courier New', monospace;
}

.md-content a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}

.md-content a:hover {
  text-decoration: underline;
}

/* 响应式 */
@media (max-width: 1024px) {
  .layout {
    flex-direction: column;
  }
  
  .sidebar {
    width: 100%;
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 1rem 0;
  }
  
  .main {
    padding: 1.5rem;
  }
  
  .games-grid {
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1rem;
  }
}

@media (max-width: 640px) {
  .navbar {
    padding: 0 1rem;
  }
  
  .navbar-links {
    display: none;
  }
  
  .main {
    padding: 1rem;
  }
  
  .games-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
  }
  
  .game-info {
    padding: 0.75rem;
  }
  
  .game-title {
    font-size: 0.875rem;
  }
  
  .md-content {
    padding: 1.5rem;
  }
  
  .md-content h1 {
    font-size: 1.5rem;
  }
}
</style>
</head>
<body>

<nav class="navbar">
  <a href="#" class="navbar-brand">
    🎮 <span>游戏殿堂</span>
  </a>
  <div class="navbar-links">
    <a href="https://www.gamer520.com/" target="_blank">gamer520</a>
    <a href="https://www.x6d.com/html/96.html" target="_blank">x6d</a>
    <a href="https://github.com/leon7786/20260724-awesome-gaming" target="_blank">GitHub</a>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <!-- 侧边栏由 JS 动态生成 -->
  </aside>

  <main class="main">
    <!-- 筛选栏 -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部游戏</button>
      <button class="filter-btn" data-filter="large">超过20GB</button>
      <button class="filter-btn" data-filter="medium">10-20GB</button>
      <button class="filter-btn" data-filter="small">小于10GB</button>
    </div>
    
    <div class="games-grid" id="gamesGrid"></div>
    <div class="md-content" id="mdContent"></div>
  </main>
</div>

<script>
// 侧边栏分类配置
const sidebarConfig = [
  {
    title: '🏆 综合榜单',
    items: [
      { name: '殿堂级 Top 250', file: '20260724-top250-by-release-date.md' },
      { name: '全球销量 Top 250', file: '20260724-global-games-top250.md' },
      { name: '平台独占精选', file: '20260724-platform-exclusives-top.md' },
    ]
  },
  {
    title: '⭐ 媒体评分',
    items: [
      { name: 'Metacritic 高分榜', file: '20260724-top-metacritic.md' },
      { name: 'OpenCritic 名人堂', file: '20260724-top-opencritic.md' },
      { name: 'IGN Top 100', file: '20260724-top-ign.md' },
      { name: 'GameSpot 满分榜', file: '20260724-top-gamespot.md' },
      { name: 'Eurogamer 推荐', file: '20260724-top-eurogamer.md' },
      { name: 'Digital Foundry', file: '20260724-top-digital-foundry.md' },
      { name: 'Famitsu 满分榜', file: '20260724-top-famitsu.md' },
      { name: 'RPS 推荐', file: '20260724-top-rps.md' },
      { name: 'Noclip 推荐', file: '20260724-top-noclip.md' },
    ]
  },
  {
    title: '💰 玩家/销量',
    items: [
      { name: 'Steam 250 高分榜', file: '20260724-steam-top250-rating.md' },
      { name: 'Steam 热销榜', file: '20260724-top-steam.md' },
      { name: 'GitHub 热门游戏', file: '20260724-games-github.md' },
    ]
  },
  {
    title: '🎖️ 大奖',
    items: [
      { name: 'TGA 年度游戏', file: '20260724-tga-awards-goty.md' },
      { name: 'Steam 大奖 10年', file: '20260724-steam-awards-10years.md' },
      { name: 'Steam 年度最佳', file: '20260724-steam-bestofyear-10years.md' },
    ]
  }
];

// 渲染侧边栏
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '<div class="sidebar-section">';
  html += '<div class="sidebar-title">导航</div>';
  html += '<a href="#" class="sidebar-link active" onclick="showGames(); return false;">🎮 游戏卡片</a>';
  html += '</div>';
  
  for (const group of sidebarConfig) {
    html += `<div class="sidebar-section">`;
    html += `<div class="sidebar-title">${group.title}</div>`;
    for (const item of group.items) {
      html += `<a href="#" class="sidebar-link" onclick="loadMd('${item.file}', this); return false;">${item.name}</a>`;
    }
    html += `</div>`;
  }
  sidebar.innerHTML = html;
}

// 显示游戏卡片
function showGames() {
  document.getElementById('gamesGrid').style.display = 'grid';
  document.getElementById('mdContent').classList.remove('active');
  document.querySelectorAll('.sidebar-link').forEach(a => a.classList.remove('active'));
  document.querySelector('.sidebar-link').classList.add('active');
}

// 加载 MD 文件
async function loadMd(file, el) {
  document.getElementById('gamesGrid').style.display = 'none';
  const content = document.getElementById('mdContent');
  content.classList.add('active');
  content.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem">加载中...</p>';
  
  document.querySelectorAll('.sidebar-link').forEach(a => a.classList.remove('active'));
  if (el) el.classList.add('active');

  try {
    const resp = await fetch(`all-md/${file}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const md = await resp.text();
    content.innerHTML = renderMarkdown(md);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    content.innerHTML = `<p style="color:#ef4444;padding:2rem">加载失败: ${e.message}</p>`;
  }
}

// Markdown 渲染器
function renderMarkdown(md) {
  let html = md;
  
  // 表格
  html = html.replace(/^(\|.+\|)\n(\|[-:| ]+\|)\n((?:\|.+\|\n?)*)/gm, (match, header, sep, body) => {
    const heads = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
    const rows = body.trim().split('\n').map(row => {
      const cells = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<table><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>`;
  });
  
  // 标题
  html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
  
  // 格式
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^>\s*(.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^---+$/gm, '<hr>');
  
  // 列表
  html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
  
  // 段落
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p>\s*<(h[1-6]|table|ul|ol|hr|blockquote)/g, '<$1');
  html = html.replace(/<\/(h[1-6]|table|ul|ol|hr|blockquote)>\s*<\/p>/g, '</$1>');
  html = html.replace(/<p>\s*<\/p>/g, '');
  
  return html;
}

// 渲染单个游戏卡片
function renderGameCard(game) {
  const downloads = game.downloads || [];
  const dlBtns = downloads.slice(0, 2).map(dl => {
    const type = dl.type || 'detail';
    const name = dl.name || type;
    const btnClass = type === 'gamer520' ? 'btn-success' : 
                    type === 'x6d' ? 'btn-primary' : 
                    type === 'magnet' ? 'btn-warning' : 'btn-secondary';
    return `<a href="${dl.url}" class="btn ${btnClass}" target="_blank" onclick="event.stopPropagation()">${name}</a>`;
  }).join('');
  
  const detailBtn = game.detail ? `<a href="${game.detail}" class="btn btn-primary">详情</a>` : '';
  
  // 存储大小标签
  let sizeTag = '';
  if (game.size_gb) {
    const sizeClass = game.size_gb >= 20 ? 'size-large' : 'size';
    sizeTag = `<span class="tag ${sizeClass}">${game.size_gb}GB</span>`;
  }
  
  return `
    <div class="game-card">
      <a href="${game.detail || '#'}" style="text-decoration:none;color:inherit;display:block">
        <div class="game-cover">
          <img src="${game.cover}" alt="${game.en_name}" loading="lazy" onerror="this.style.display='none'">
        </div>
      </a>
      <div class="game-info">
        <div class="game-title">${game.cn_name}</div>
        <div class="game-subtitle">${game.en_name}</div>
        <div class="game-meta">
          <span class="tag year">${game.year}</span>
          ${game.score ? `<span class="tag score">⭐ ${game.score}</span>` : ''}
          ${sizeTag}
        </div>
        <div class="game-actions">
          ${dlBtns}
          ${detailBtn}
        </div>
      </div>
    </div>
  `;
}

// 全局游戏数据
let allGames = [];
let currentFilter = 'all';

// 筛选游戏
function filterGames(games, filter) {
  if (filter === 'all') return games;
  
  return games.filter(game => {
    const size = game.size_gb || 0;
    if (filter === 'large') return size >= 20;
    if (filter === 'medium') return size >= 10 && size < 20;
    if (filter === 'small') return size < 10;
    return true;
  });
}

// 渲染游戏列表
function renderGames(games) {
  // 分离Windows和非Windows游戏
  const windowsGames = games.filter(g => g.is_windows !== false);
  const nonWindowsGames = games.filter(g => g.is_windows === false);
  
  // 按年份降序排列
  windowsGames.sort((a, b) => parseInt(b.year) - parseInt(a.year));
  nonWindowsGames.sort((a, b) => parseInt(b.year) - parseInt(a.year));
  
  const grid = document.getElementById('gamesGrid');
  
  // 渲染Windows游戏
  let html = windowsGames.map(renderGameCard).join('');
  
  // 如果有非Windows游戏，添加分组
  if (nonWindowsGames.length > 0) {
    html += `
      <div style="grid-column: 1 / -1; margin-top: 3rem; margin-bottom: 1rem;">
        <h2 style="font-size: 1.5rem; font-weight: 600; color: var(--text-primary); padding-bottom: 0.75rem; border-bottom: 2px solid var(--border);">
          🎮 非Windows平台独占
        </h2>
        <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.5rem;">
          以下游戏为其他平台独占，暂不支持Windows
        </p>
      </div>
    `;
    html += nonWindowsGames.map(renderGameCard).join('');
  }
  
  grid.innerHTML = html;
}

// 加载游戏数据
async function loadGames() {
  try {
    const resp = await fetch('games.json');
    allGames = await resp.json();
    
    // 初始渲染
    renderGames(filterGames(allGames, currentFilter));
  } catch (e) {
    console.error('加载游戏数据失败:', e);
  }
}

// 筛选按钮事件监听
function initFilters() {
  const filterBtns = document.querySelectorAll('.filter-btn');
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      // 更新按钮状态
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      // 更新筛选条件
      currentFilter = btn.dataset.filter;
      
      // 重新渲染
      renderGames(filterGames(allGames, currentFilter));
    });
  });
}

// 初始化
renderSidebar();
loadGames();
initFilters();
</script>
