<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 殿堂级游戏榜单 - Top 250 + 下载导航</title>
<style>
:root {
  --primary: #6d28d9;
  --primary-light: #8b5cf6;
  --accent: #e11d48;
  --bg: #f0f0f5;
  --card-bg: #ffffff;
  --text: #1a1a2e;
  --text-light: #666;
  --border: #e0e0e4;
  --shadow: rgba(0,0,0,0.08);
  --radius: 12px;
  --sidebar-w: 280px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

/* 顶部导航 */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1.5rem;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-brand {
  font-size: 1.3rem; font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-decoration: none;
}
.topbar-links { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.topbar-links a {
  color: var(--text-light); text-decoration: none;
  padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem;
  transition: all 0.2s;
}
.topbar-links a:hover { background: var(--primary); color: white; }

/* 主体布局 */
.layout {
  display: flex;
  max-width: 1600px;
  margin: 0 auto;
  min-height: calc(100vh - 60px);
}

/* 侧边栏 */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  padding: 1.5rem 0;
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

.sidebar-group { margin-bottom: 1.2rem; }
.sidebar-group-title {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-light);
  padding: 0 1.2rem;
  margin-bottom: 0.4rem;
}
.sidebar-link {
  display: block;
  padding: 0.5rem 1.2rem;
  color: var(--text);
  text-decoration: none;
  font-size: 0.88rem;
  transition: all 0.2s;
  border-left: 3px solid transparent;
}
.sidebar-link:hover {
  background: #f5f3ff;
  border-left-color: var(--primary);
  color: var(--primary);
}
.sidebar-link.active {
  background: #f5f3ff;
  border-left-color: var(--primary);
  color: var(--primary);
  font-weight: 600;
}
.sidebar-link .badge {
  font-size: 0.7rem;
  background: #f0f0f5;
  color: var(--text-light);
  padding: 1px 6px;
  border-radius: 10px;
  margin-left: 4px;
}

/* 主内容区 */
.main {
  flex: 1;
  min-width: 0;
  padding: 2rem;
}

/* Markdown 渲染样式 */
.md-content {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 2rem;
  box-shadow: 0 2px 8px var(--shadow);
}
.md-content h1 {
  font-size: 1.8rem;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 2px solid var(--border);
}
.md-content h2 {
  font-size: 1.3rem;
  color: var(--text);
  margin: 1.5rem 0 0.75rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}
.md-content h3 {
  font-size: 1.1rem;
  color: var(--primary);
  margin: 1rem 0 0.5rem;
}
.md-content p {
  margin-bottom: 0.75rem;
  color: #444;
}
.md-content ul, .md-content ol {
  padding-left: 1.5rem;
  margin-bottom: 0.75rem;
}
.md-content li { margin-bottom: 0.3rem; }
.md-content strong { color: var(--text); }
.md-content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 1.5rem 0;
}
.md-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 1rem 0;
  font-size: 0.9rem;
}
.md-content th {
  background: #f5f3ff;
  color: var(--primary);
  font-weight: 600;
  padding: 0.6rem 0.8rem;
  text-align: left;
  border-bottom: 2px solid var(--border);
}
.md-content td {
  padding: 0.5rem 0.8rem;
  border-bottom: 1px solid var(--border);
}
.md-content tr:hover td {
  background: #fafafa;
}
.md-content blockquote {
  border-left: 4px solid var(--primary);
  padding: 0.5rem 1rem;
  margin: 1rem 0;
  background: #f9f8ff;
  color: #555;
}
.md-content code {
  background: #f0f0f5;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.85em;
}

/* 游戏详情卡片链接 */
.md-content a {
  color: var(--primary);
  text-decoration: none;
}
.md-content a:hover {
  text-decoration: underline;
}

/* 移动端 */
@media (max-width: 900px) {
  .layout { flex-direction: column; }
  .sidebar {
    width: 100%;
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 1rem 0;
  }
  .sidebar-group { margin-bottom: 0.5rem; }
  .sidebar-group-title { padding: 0 1rem; }
  .sidebar-link { padding: 0.4rem 1rem; font-size: 0.82rem; }
  .main { padding: 1rem; }
  .md-content { padding: 1rem; }
  .md-content h1 { font-size: 1.4rem; }
  .md-content table { font-size: 0.8rem; }
  .md-content th, .md-content td { padding: 0.4rem; }
}
</style>
</head>
<body>

<nav class="topbar">
  <a href="#" class="topbar-brand">🎮 殿堂级游戏榜单</a>
  <div class="topbar-links">
    <a href="games/" target="_blank">📁 游戏详情</a>
    <a href="https://www.gamer520.com/" target="_blank">gamer520</a>
    <a href="https://www.x6d.com/html/96.html" target="_blank">x6d</a>
    <a href="https://github.com/leon7786/20260724-awesome-gaming" target="_blank">GitHub</a>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <!-- 侧边栏由 JS 动态生成 -->
  </aside>

  <main class="main">
    <div class="md-content" id="content">
      <p style="text-align:center;color:#999;padding:2rem">加载中...</p>
    </div>
  </main>
</div>

<script>
// 侧边栏分类配置
const sidebarConfig = [
  {
    title: '🏆 综合榜单',
    items: [
      { name: '殿堂级 Top 250 (按发行日期)', file: '20260724-top250-by-release-date.md', active: true },
      { name: '全球游戏销量 Top 250', file: '20260724-global-games-top250.md' },
      { name: '平台独占精选', file: '20260724-platform-exclusives-top.md' },
    ]
  },
  {
    title: '⭐ 媒体评分榜',
    items: [
      { name: 'Metacritic 高分榜', file: '20260724-top-metacritic.md' },
      { name: 'OpenCritic 名人堂', file: '20260724-top-opencritic.md' },
      { name: 'IGN Top 100', file: '20260724-top-ign.md' },
      { name: 'GameSpot 满分榜', file: '20260724-top-gamespot.md' },
      { name: 'Eurogamer 推荐', file: '20260724-top-eurogamer.md' },
      { name: 'Digital Foundry 画质', file: '20260724-top-digital-foundry.md' },
      { name: 'Famitsu 满分榜', file: '20260724-top-famitsu.md' },
      { name: 'RPS 推荐', file: '20260724-top-rps.md' },
      { name: 'Noclip 推荐', file: '20260724-top-noclip.md' },
    ]
  },
  {
    title: '💰 玩家/销量榜',
    items: [
      { name: 'Steam 250 高分榜', file: '20260724-steam-top250-rating.md' },
      { name: 'Steam 热销榜', file: '20260724-top-steam.md' },
      { name: 'GitHub 热门游戏', file: '20260724-games-github.md' },
    ]
  },
  {
    title: '🎖️ 大奖榜',
    items: [
      { name: 'TGA 年度游戏', file: '20260724-tga-awards-goty.md' },
      { name: 'Steam 大奖 10年', file: '20260724-steam-awards-10years.md' },
      { name: 'Steam 年度最佳 10年', file: '20260724-steam-bestofyear-10years.md' },
    ]
  }
];

// 渲染侧边栏
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '';
  for (const group of sidebarConfig) {
    html += `<div class="sidebar-group">`;
    html += `<div class="sidebar-group-title">${group.title}</div>`;
    for (const item of group.items) {
      const activeClass = item.active ? ' active' : '';
      html += `<a href="#" class="sidebar-link${activeClass}" data-file="${item.file}" onclick="loadMd('${item.file}', this); return false;">${item.name}</a>`;
    }
    html += `</div>`;
  }
  sidebar.innerHTML = html;
}

// 加载 MD 文件并渲染
async function loadMd(file, el) {
  // 更新 active 状态
  document.querySelectorAll('.sidebar-link').forEach(a => a.classList.remove('active'));
  if (el) el.classList.add('active');

  const content = document.getElementById('content');
  content.innerHTML = '<p style="text-align:center;color:#999;padding:2rem">加载中...</p>';

  try {
    const resp = await fetch(`all-md/${file}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const md = await resp.text();
    content.innerHTML = renderMarkdown(md);
    // 滚动到顶部
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    content.innerHTML = `<p style="color:red;padding:2rem">加载失败: ${e.message}</p>`;
  }
}

// 简易 Markdown 渲染器
function renderMarkdown(md) {
  let html = md;

  // 表格
  html = html.replace(/^(\|.+\|)\n(\|[-:| ]+\|)\n((?:\|.+\|\n?)*)/gm, (match, header, sep, body) => {
    const heads = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
    const rows = body.trim().split('\n').map(row => {
      const cells = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<table><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>`;
  });

  // 标题
  html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

  // 粗体/斜体
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // 代码
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // 引用
  html = html.replace(/^>\s*(.+)$/gm, '<blockquote>$1</blockquote>');

  // 分割线
  html = html.replace(/^---+$/gm, '<hr>');

  // 无序列表
  html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

  // 有序列表
  html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');

  // 段落
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';

  // 清理空标签
  html = html.replace(/<p>\s*<(h[1-6]|table|ul|ol|hr|blockquote)/g, '<$1');
  html = html.replace(/<\/(h[1-6]|table|ul|ol|hr|blockquote)>\s*<\/p>/g, '</$1>');
  html = html.replace(/<p>\s*<\/p>/g, '');

  return html;
}

// 初始化
renderSidebar();
loadMd('20260724-top250-by-release-date.md', document.querySelector('.sidebar-link.active'));
</script>

</body>
</html>
